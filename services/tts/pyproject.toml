[project]
name = "sinhala-tts"
version = "0.0.1"
description = "Sinhala XTTS text front end and inference adapter for the accessible reader"
requires-python = ">=3.12"

# numpy only. The audio checks operate on the float waveform the model returns,
# which is a numpy array in the real pipeline, so they are written against it
# rather than against a hand-rolled sequence type.
#
# Deliberately absent: torch, coqui-tts, and everything else needed to actually
# run the model. The text path and the audio checks must stay testable on any
# machine without CUDA or the 5.6 GB checkpoint, which is what keeps them
# verifiable on every pull request. Inference dependencies arrive with the
# adapter that needs them, pinned against the runtime they were measured in
# rather than copied from another project.
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# src is put on the path directly so the tests need no install step. There is
# no packaging or distribution story yet, and inventing one would mean
# documenting commands nobody has run.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

# The vendored front end defines what the model heard during training. Linting
# it would invite edits that silently change pronunciation. See
# src/sinhala_tts/vendor/PROVENANCE.md.
extend-exclude = ["src/sinhala_tts/vendor/sinhala_text.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
