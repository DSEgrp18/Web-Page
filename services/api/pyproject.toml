[project]
name = "sinhala-reader-api"
version = "0.0.1"
description = "Reader API: documents, preparation jobs, segments, audio, and progress"
requires-python = ">=3.12"

# FastAPI for the app, python-multipart for file uploads. Everything else the
# API needs comes from the two service packages beside it.
#
# psycopg is an *extra*, not a hard dependency. The in-memory store is the
# default, and a contributor building the reader interface should not need a
# database driver to run the tests. `pip install -e .[postgres]` adds it.
#
# Still deliberately absent: Redis, Celery, and an object store. CLAUDE.md names
# them as the intended production shape and none of them exists yet; the
# interfaces are where they arrive.
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
# The two service packages are on the path directly, as they are in the worker.
# Nothing is published, so nothing is installed.
pythonpath = ["src", "tests", "../worker/src", "../tts/src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
