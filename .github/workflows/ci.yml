# Continuous integration for the Sinhala Accessible Reader.
#
# This workflow deliberately only runs checks over content that exists today:
# the repository guards, the TTS text path, document extraction, the reader API,
# and the reader interface. Container builds and database integration tests are
# added to this file in the same pull requests that introduce the code they
# check, as required by CLAUDE.md. A check that is skipped or absent must never
# be able to stand in for a passing test.
#
# Nothing here needs a GPU, the 5.6 GB checkpoint, or a sample PDF. That is what
# keeps every job runnable on a free runner for every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch are wasteful; in-progress runs on main are
# not cancelled so the default branch always has a conclusive result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege. No job here needs to write to the repository, and pull
# requests from forks must never receive a writable token.
permissions:
  contents: read

jobs:
  vendored-assets:
    name: Vendored assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify legacy font tables against recorded hashes
        run: scripts/verify-vendored-assets.sh

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for model weights, audio, documents, and secrets
        run: scripts/verify-repo-hygiene.sh

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --severity=style scripts/*.sh

  tts-text-frontend:
    name: TTS text front end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/tts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test tooling
        # numpy is the only runtime dependency: the audio checks operate on the
        # waveform the model returns. No torch, no CUDA, and no 5.6 GB
        # checkpoint — that is deliberate, and it is what keeps the text path
        # and the audio checks verifiable on every pull request. The real-model
        # smoke test runs separately, on hardware that has the bundle.
        #
        # ruff is pinned exactly rather than floated. An unpinned ">=0.15"
        # resolved to a newer release that formats Markdown code blocks as well
        # as Python, so a README that passed locally failed here. A check that
        # changes behaviour on its own schedule is worse than one that is
        # slightly old; Dependabot proposes upgrades and they get reviewed.
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest>=8" "ruff==0.15.20" "numpy>=1.26"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m pytest

  document-extraction:
    name: Document extraction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test tooling
        # pdfplumber is the only runtime dependency. Its own pin lives in
        # services/worker/pyproject.toml; ruff is pinned exactly here for the
        # same reason as in the job above — a formatter that changes behaviour
        # on its own schedule turns a green branch red without a commit.
        #
        # No PDFs are downloaded or committed: tests/pdf_fixtures.py writes the
        # documents it needs in memory. Repository hygiene blocks *.pdf outright.
        run: |
          python -m pip install --disable-pip-version-check \
            "pdfplumber>=0.11.4" "pytest>=8" "ruff==0.15.20"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m pytest

  reader-api:
    name: Reader API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    # A real PostgreSQL, because CLAUDE.md is explicit that mocks alone do not
    # validate integration. Without this the store contract's Postgres half and
    # every route test in test_postgres_routes.py skip, and the job reports
    # green for checks nobody ran.
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A real broker, for the same reason as the real database: the claims
      # worth testing are that a task crosses a process boundary and that a
      # retry actually retries, and Celery's eager mode short-circuits both.
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test tooling
        # The API sits on both service packages, so this job installs their
        # runtime dependencies too: pdfplumber for extraction, numpy for the
        # audio the synthesis adapter returns.
        #
        # Still no torch and no checkpoint. The development adapter produces a
        # tone, which is enough to exercise every route, the cache, and the
        # deduplication — and it is what keeps the whole API testable on a free
        # runner. Real-model checks belong on hardware that has the bundle.
        run: |
          python -m pip install --disable-pip-version-check             "fastapi>=0.115" "python-multipart>=0.0.9" "httpx>=0.27"             "pdfplumber>=0.11.4" "numpy>=1.26" "pytest>=8" "ruff==0.15.20"             "psycopg[binary]>=3.2" "psycopg-pool>=3.2" "celery>=5.4" "redis>=5"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        # The URL is what turns the Postgres half of the store contract and the
        # database route tests on. If it is ever removed, those tests skip
        # rather than fail, so the assertion below exists to make that loud.
        env:
          SINHALA_READER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reader_test
          SINHALA_READER_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest
      - name: Confirm the integration tests actually ran
        # A skipped integration test reports green for something nobody ran.
        env:
          SINHALA_READER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reader_test
          SINHALA_READER_REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/test_postgres_routes.py tests/test_store_contract.py             tests/test_queue.py -q --no-header -rs 2>&1 | tee /tmp/integration.log
          if grep -q "SKIPPED" /tmp/integration.log; then
            echo "::error::Database or queue tests were skipped. They must run in CI."
            exit 1
          fi
      - name: Check the reader interface against this API's schema
        # Here rather than in the frontend job because the schema comes from
        # FastAPI itself, and this is the job that already has FastAPI. No
        # server is started and no npm packages are needed: the script uses
        # only Node built-ins, and Node is preinstalled on the runner.
        #
        # apps/web/src/lib/types.ts is written by hand. This is what stops it
        # drifting silently, which fails in the worst way available: the reader
        # is quietly told a field is missing on every page of the book.
        working-directory: .
        run: |
          export PYTHONPATH="services/api/src:services/worker/src:services/tts/src"
          python -c "import json, sinhala_reader; print(json.dumps(sinhala_reader.create_app().openapi()))" > "${RUNNER_TEMP}/openapi.json"
          node apps/web/scripts/verify-contract.mjs "${RUNNER_TEMP}/openapi.json"

  reader-ui:
    name: Reader UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        # `npm ci` and not `npm install`: the lockfile is the pinned set, and a
        # frontend that silently upgrades a transitive dependency between a
        # green run and a deployment is not reproducible.
        run: npm ci
      - name: Lint
        # Includes eslint-plugin-jsx-a11y, which catches the accessibility
        # mistakes that are invisible in a browser and obvious in a screen
        # reader. It does not replace testing with NVDA and TalkBack.
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests and accessibility smoke test
        # tests/a11y.test.tsx runs axe over the core reader flows. Automated
        # rules find a fraction of real barriers; manual screen-reader testing
        # stays a separate release requirement, as CLAUDE.md says.
        run: npm test
      - name: Production build
        run: npm run build

  # Aggregate gate. This is the single required status check on main, so it must
  # always report a conclusion, even when a job above is skipped or cancelled.
  #
  # When path filters are added to the jobs above, give the filtered job a
  # no-op success path rather than letting it be skipped: a skipped dependency
  # is treated as a failure here precisely so a path filter cannot silently
  # satisfy a required check.
  ci:
    name: ci
    if: always()
    needs:
      [
        vendored-assets,
        repo-hygiene,
        shell-scripts,
        tts-text-frontend,
        document-extraction,
        reader-api,
        reader-ui,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required CI job did not succeed (${RESULTS})."
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
