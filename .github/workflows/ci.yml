# Continuous integration for the Sinhala Accessible Reader.
#
# This workflow deliberately only runs checks over content that exists today:
# the repository guards, the TTS text path, and document extraction. Frontend
# builds, container builds, database integration tests, and the accessibility
# smoke test are added to this file in the same pull requests that introduce
# the code they check, as required by CLAUDE.md. A check that is skipped or
# absent must never be able to stand in for a passing test.
#
# Nothing here needs a GPU, the 5.6 GB checkpoint, or a sample PDF. That is what
# keeps every job runnable on a free runner for every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch are wasteful; in-progress runs on main are
# not cancelled so the default branch always has a conclusive result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege. No job here needs to write to the repository, and pull
# requests from forks must never receive a writable token.
permissions:
  contents: read

jobs:
  vendored-assets:
    name: Vendored assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify legacy font tables against recorded hashes
        run: scripts/verify-vendored-assets.sh

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for model weights, audio, documents, and secrets
        run: scripts/verify-repo-hygiene.sh

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --severity=style scripts/*.sh

  tts-text-frontend:
    name: TTS text front end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/tts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test tooling
        # numpy is the only runtime dependency: the audio checks operate on the
        # waveform the model returns. No torch, no CUDA, and no 5.6 GB
        # checkpoint — that is deliberate, and it is what keeps the text path
        # and the audio checks verifiable on every pull request. The real-model
        # smoke test runs separately, on hardware that has the bundle.
        #
        # ruff is pinned exactly rather than floated. An unpinned ">=0.15"
        # resolved to a newer release that formats Markdown code blocks as well
        # as Python, so a README that passed locally failed here. A check that
        # changes behaviour on its own schedule is worse than one that is
        # slightly old; Dependabot proposes upgrades and they get reviewed.
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest>=8" "ruff==0.15.20" "numpy>=1.26"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m pytest

  document-extraction:
    name: Document extraction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test tooling
        # pdfplumber is the only runtime dependency. Its own pin lives in
        # services/worker/pyproject.toml; ruff is pinned exactly here for the
        # same reason as in the job above — a formatter that changes behaviour
        # on its own schedule turns a green branch red without a commit.
        #
        # No PDFs are downloaded or committed: tests/pdf_fixtures.py writes the
        # documents it needs in memory. Repository hygiene blocks *.pdf outright.
        run: |
          python -m pip install --disable-pip-version-check \
            "pdfplumber>=0.11.4" "pytest>=8" "ruff==0.15.20"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m pytest

  # Aggregate gate. This is the single required status check on main, so it must
  # always report a conclusion, even when a job above is skipped or cancelled.
  #
  # When path filters are added to the jobs above, give the filtered job a
  # no-op success path rather than letting it be skipped: a skipped dependency
  # is treated as a failure here precisely so a path filter cannot silently
  # satisfy a required check.
  ci:
    name: ci
    if: always()
    needs:
      [
        vendored-assets,
        repo-hygiene,
        shell-scripts,
        tts-text-frontend,
        document-extraction,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required CI job did not succeed (${RESULTS})."
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
