# TrOCR Sinhala recognition, as an overlay rather than a setting.
#
#     export TROCR_MODEL_DIR="/path/to/models/trocr_sinhala_eshangj"
#     docker compose -f infra/docker-compose.yml -f infra/compose.trocr.yml up --build
#
# An overlay because it needs torch and a ~1.3 GB Hub checkpoint the base image
# deliberately omits. Somebody without the bundle should still get Tesseract OCR
# for broken pages, not a stack that refuses to start.
#
# Download first (from the repository root), then point TROCR_MODEL_DIR at the
# folder. See docs/trocr-sinhala-ocr.md.
#
#     hf download eshangj/TrOCR-Sinhala-finetuned \
#       --revision 0c1687ce548c38d4d6b5acc611ec5f91f5a6b412 \
#       --local-dir models/trocr_sinhala_eshangj
#
# Or for the Ransaka checkpoint:
#
#     hf download Ransaka/TrOCR-Sinhala \
#       --revision 922910beb2f14c0c230c89037280cba9601c58cc \
#       --local-dir models/trocr_sinhala_ransaka
#     export SINHALA_READER_TROCR_CHECKPOINT=ransaka
#     export TROCR_MODEL_DIR="/path/to/models/trocr_sinhala_ransaka"
#
# Do not make this the compose default until a fixed-page bake-off picks a
# checkpoint. Tesseract remains the engine in the base file.

services:
  api:
    build:
      dockerfile: infra/api.Dockerfile
      args:
        WITH_TROCR: "1"
    environment:
      SINHALA_READER_OCR: ${SINHALA_READER_OCR:-broken}
      SINHALA_READER_OCR_ENGINE: trocr
      SINHALA_READER_TROCR_CHECKPOINT: ${SINHALA_READER_TROCR_CHECKPOINT:-eshangj}
      SINHALA_READER_TROCR_MODEL_DIR: /models/trocr_sinhala
      SINHALA_READER_TROCR_DEVICE: ${SINHALA_READER_TROCR_DEVICE:-cpu}
    volumes:
      - ${TROCR_MODEL_DIR:?set TROCR_MODEL_DIR to the downloaded TrOCR checkpoint folder}:/models/trocr_sinhala:ro

  worker:
    build:
      dockerfile: infra/api.Dockerfile
      args:
        WITH_TROCR: "1"
    environment:
      SINHALA_READER_OCR: ${SINHALA_READER_OCR:-broken}
      SINHALA_READER_OCR_ENGINE: trocr
      SINHALA_READER_TROCR_CHECKPOINT: ${SINHALA_READER_TROCR_CHECKPOINT:-eshangj}
      SINHALA_READER_TROCR_MODEL_DIR: /models/trocr_sinhala
      SINHALA_READER_TROCR_DEVICE: ${SINHALA_READER_TROCR_DEVICE:-cpu}
    volumes:
      - ${TROCR_MODEL_DIR:?set TROCR_MODEL_DIR to the downloaded TrOCR checkpoint folder}:/models/trocr_sinhala:ro
