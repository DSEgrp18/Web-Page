# The real voice, as an overlay rather than a setting.
#
#     docker compose -f infra/docker-compose.yml -f infra/compose.voice.yml up --build
#
# An overlay because it needs things the base file cannot assume anybody has: a
# much larger image, and the 5.6 GB model bundle on the host. Somebody without
# the bundle should get a working reader and a labelled tone, not a stack that
# refuses to start.
#
# MODEL_DIR is the path on **your machine**. There is no default, so a missing
# one fails immediately with a clear message instead of mounting nothing and
# failing later at the first synthesis.
#
# Only the API (on-demand clips) and the voice-worker (class pre-render) load
# the checkpoint. The PDF worker used to load it as well, which stacked an
# 8 GB extraction peak on an 8 GB model load and OOM-killed the API (audit E1).

services:
  api:
    build:
      dockerfile: infra/tts.Dockerfile
    environment:
      SINHALA_READER_TTS: xtts
      SINHALA_READER_TTS_DEVICE: ${SINHALA_READER_TTS_DEVICE:-cpu}
      SINHALA_READER_TTS_PRECISION: ${SINHALA_READER_TTS_PRECISION:-fp16}
    volumes:
      # Read-only: nothing in this system has any reason to write to a
      # checkpoint, and a read-only mount makes that true rather than intended.
      - ${MODEL_DIR:?set MODEL_DIR to the folder containing xtts_si_female}:/models:ro
    healthcheck:
      # The checkpoint takes over a minute to load and readiness reports that
      # honestly, so the container needs longer before it is called unhealthy.
      # /health still answers immediately: liveness and model readiness are
      # separate questions, and a cold model is not a reason to restart.
      start_period: 180s

  worker:
    build:
      dockerfile: infra/tts.Dockerfile
    environment:
      # Extraction does not synthesise. Loading XTTS here is how the host ran
      # out of memory while a book was prepared.
      SINHALA_READER_TTS: development
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR to the folder containing xtts_si_female}:/models:ro

  # Named here, not inherited. The base file's `extends: worker` resolves
  # against the base file's worker, before this overlay is merged, so without
  # this block the worker that pre-renders class books kept the placeholder
  # tone and had no model mounted.
  voice-worker:
    build:
      dockerfile: infra/tts.Dockerfile
    environment:
      SINHALA_READER_TTS: xtts
      SINHALA_READER_TTS_DEVICE: ${SINHALA_READER_TTS_DEVICE:-cpu}
      SINHALA_READER_TTS_PRECISION: ${SINHALA_READER_TTS_PRECISION:-fp16}
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR to the folder containing xtts_si_female}:/models:ro
